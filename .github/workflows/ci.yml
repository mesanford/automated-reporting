name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pip-audit

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        # models.py was migrated to SQLAlchemy 2.0 Mapped[]/mapped_column()
        # style (from the legacy Column() style, which mypy saw as
        # Column[T] instead of T and reported hundreds of false-positive
        # errors). The codebase is now mypy-clean, so this is a blocking
        # gate — any new type error fails CI.
        run: mypy app main.py --ignore-missing-imports

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Apply migrations to a temp SQLite
        env:
          DATABASE_URL: sqlite:///./ci-test.db
        run: alembic upgrade head

      - name: Run pytest
        env:
          DATABASE_URL: sqlite:///./ci-pytest.db
          ALLOW_DEV_AUTH: "1"
        run: pytest

  frontend:
    name: Frontend Lint and Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit
