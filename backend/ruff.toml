# Ruff configuration for CI linting.
#
# Rule set: pyflakes (F) + pycodestyle errors (E), Ruff's default. This
# catches real bugs (unused/undefined names, unused imports) without
# imposing a full style rewrite on existing code.
target-version = "py310"

[lint]
# Pin the rule set explicitly rather than inheriting Ruff's default, which
# has widened over time: CI installs ruff unpinned, so a new release silently
# turned this gate red (1007 errors, almost all upstream style-rule churn).
# Selecting here means the gate measures the code, not Ruff's release notes.
select = ["E", "F"]

# E701 (compact `if x: y` single-line statements) is used deliberately and
# consistently for terse PATCH-style partial-update handlers (e.g.
# app/api/alerts.py's `if body.field is not None: obj.field = body.field`
# blocks) — treated as accepted style rather than a violation.
# E501 (line too long) is not enforced: the codebase has never satisfied it
# (648 violations at the time of writing) and Ruff's historical default rule
# set excluded E5 for exactly this reason -- line length is a formatter's job,
# not a lint gate. Selecting all of "E" above pulls it in, so it is turned off
# explicitly rather than by omission.
ignore = ["E701", "E501"]

[lint.per-file-ignores]
# main.py deliberately calls configure_observability() before importing
# app.api/app.services so logging is set up before those modules run any
# module-level code. That ordering requires imports below the top of file.
"main.py" = ["E402"]
